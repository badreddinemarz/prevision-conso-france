[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["conso"]

[project]
name = "prevision-conso-france"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "holidays>=0.106",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
]
